spring.application.name=internship-java-2026-korolchuk
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.datasource.url=jdbc:postgresql://localhost:5432/BusinessTrips
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.data.web.pageable.max-page-size=100
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=API for travel requests management
info.app.description=Project for senla internship in 2026 by Korolchuk
info.app.version=1.0
springdoc.swagger-ui.operationsSorter=method
springdoc.paths-to-match=/api/v1/**