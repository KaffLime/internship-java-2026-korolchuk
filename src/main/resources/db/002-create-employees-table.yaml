databaseChangeLog:
  - changeSet:
      id: create-employees-table
      author: artem
      changes:
        - createTable:
            tableName: employees
            remarks: сотрудники
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_employees
                    nullable: false
              - column:
                  name: full_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: text
                  constraints:
                    unique: true
              - column:
                  name: position
                  type: text
              - column:
                  name: department_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: hire_date
                  type: date
        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_employees_department_id_departments
            onDelete: CASCADE
            onUpdate: RESTRICT
        - sql:
            sql: |
              ALTER TABLE employees ADD CONSTRAINT check_employees_email
              CHECK (email ~ '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$')