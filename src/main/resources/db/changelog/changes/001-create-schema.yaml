databaseChangeLog:
  - changeSet:
      id: create-departments-table
      author: artem
      changes:
        - createTable:
            tableName: departments
            remarks: отделы
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_departments
                    nullable: false
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: varchar(10)
                  constraints:
                    unique: true
  - changeSet:
      id: create-employees-table
      author: artem
      changes:
        - createTable:
            tableName: employees
            remarks: сотрудники
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_employees
                    nullable: false
              - column:
                  name: full_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: text
                  constraints:
                    unique: true
              - column:
                  name: position
                  type: text
              - column:
                  name: department_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: hire_date
                  type: date
        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_employees_department_id_departments
            onDelete: RESTRICT
            onUpdate: RESTRICT
  - changeSet:
      id: create-travel-requests-table
      author: artem
      changes:
        - createTable:
            tableName: travel_requests
            remarks: заявки на командировку
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_travel_requests
                    nullable: false
              - column:
                  name: employee_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: destination
                  type: text
              - column:
                  name: start_date
                  type: date
              - column:
                  name: end_date
                  type: date
              - column:
                  name: purpose
                  type: varchar(500)
              - column:
                  name: status
                  type: varchar(32)
                  defaultValue: 'DRAFT'
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: estimated_cost
                  type: numeric
        - addForeignKeyConstraint:
            baseTableName: travel_requests
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_travel_requests_employee_id_employees
            onDelete: RESTRICT
            onUpdate: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: travel_requests
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_travel_requests_department_id_departments
            onDelete: RESTRICT
            onUpdate: RESTRICT
  - changeSet:
      id: create-requests-history-table
      author: artem
      changes:
        - createTable:
            tableName: requests_history
            remarks: история заявок
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
              - column:
                  name: travel_request_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: old_status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: new_status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: text
        - addForeignKeyConstraint:
            baseTableName: requests_history
            baseColumnNames: travel_request_id
            referencedTableName: travel_requests
            referencedColumnNames: id
            constraintName: fk_requests_history_travel_request_id_travel_requests
            onDelete: CASCADE
            onUpdate: RESTRICT