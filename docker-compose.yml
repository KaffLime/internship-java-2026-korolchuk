services:
  postgres:
    image: postgres:15
    container_name: business_trips_postgres
    environment:
      POSTGRES_DB: BusinessTrips
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d BusinessTrips" ]
      interval: 5s
      timeout: 5s
      retries: 5