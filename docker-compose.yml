services:
  postgres:
    image: postgres:15
    container_name: business_trips_postgres
    environment:
      POSTGRES_DB: BusinessTrips
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d BusinessTrips" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev,test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/BusinessTrips
    depends_on:
      postgres:
        condition: service_healthy
  mongodb:
    image: mongo:9.0.8
    container_name: travel_requests_history_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin}
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - mongo-data:/var/lib/mongodb/data
  notification-service:
    build:
      context: ../notification-service-internship-java-2026-korolchuk
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_MONGODB_URI: mongodb://admin:${MONGODB_PASSWORD:-admin}@mongodb:27017/TravelRequestHistory?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  pgdata:
  mongo-data: